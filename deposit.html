<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit | LAS VEGAS</title>
    <style>
        :root {
            --pink: #FF007F;
            --green: #006400;
            --bg: #FFF5F7;
        }
        body { font-family: 'Quicksand', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .card { background: white; border-radius: 20px; border: 1px solid #FFD1E3; padding: 25px; box-shadow: 0 10px 30px rgba(255,0,127,0.05); }
        .btn-pay { background: var(--pink); color: white; border: none; padding: 16px; border-radius: 50px; width: 100%; font-weight: 700; cursor: pointer; }
        .btn-pay:disabled { opacity: 0.7; cursor: not-allowed; }
        .status-badge { display: inline-block; padding: 5px 15px; border-radius: 50px; font-size: 12px; font-weight: 800; }
        .status-pending { background: #FFF9E6; color: #D4A017; }
        .status-completed { background: #F0FFF4; color: var(--green); }
        .input-group { margin: 20px 0; }
        input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #FFD1E3; font-size: 16px; box-sizing: border-box; }
        .error-text { color: #D4183D; font-size: 13px; margin-top: 8px; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color: var(--pink); margin-top: 0;">Deposit Funds</h2>
        <p style="color: #666; font-size: 14px;">Add funds securely via Bank Transfer.</p>

        <div class="input-group">
            <label style="font-weight: 700; color: var(--pink);">Amount (₦)</label>
            <input type="number" id="deposit-amount" placeholder="Minimum 3,000" min="3000">
        </div>

        <button class="btn-pay" id="pay-btn">PAY NOW</button>
        <div id="error-text" class="error-text"></div>

        <div id="status-area" style="margin-top: 30px; display: none;">
            <hr style="border: 0; border-top: 1px solid #eee; margin-bottom: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span id="ref-text" style="font-size: 12px; color: #999;">Ref: --</span>
                <span id="status-pill" class="status-badge">Checking...</span>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const supabase = createClient(import.meta.env.VITE_SUPABASE_URL, import.meta.env.VITE_SUPABASE_ANON_KEY);

        const payBtn = document.getElementById('pay-btn');
        const errorText = document.getElementById('error-text');

        function showError(msg) {
            errorText.textContent = msg;
            errorText.style.display = 'block';
        }

        function resetButton() {
            payBtn.innerText = 'PAY NOW';
            payBtn.disabled = false;
        }

        payBtn.onclick = async () => {
            errorText.style.display = 'none';

            const amountInput = document.getElementById('deposit-amount');
            const amount = Number(amountInput.value);

            if (!amount || amount < 3000) {
                showError('Minimum deposit is ₦3,000');
                return;
            }

            // Must be logged in — this endpoint requires a Supabase session token
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                showError('Your session has expired. Please log in again.');
                return;
            }

            payBtn.innerText = 'REDIRECTING...';
            payBtn.disabled = true;

            try {
                const res = await fetch('/api/finance?resource=payments&action=initiate-deposit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${session.access_token}`
                    },
                    body: JSON.stringify({ amount })
                });

                let data;
                try {
                    data = await res.json();
                } catch (parseErr) {
                    throw new Error(`Server returned an unexpected response (status ${res.status}). Check /api/finance logs.`);
                }

                if (!res.ok) {
                    throw new Error(data?.message || `Server error (status ${res.status})`);
                }

                if (data.success && data.payInfo) {
                    window.location.href = data.payInfo;
                } else {
                    throw new Error(data.message || 'No payment redirect URL was returned.');
                }
            } catch (err) {
                console.error('Payment initiation failed:', err);
                showError(err.message);
                resetButton();
            }
        };
    </script>
</body>
</html>
