<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Users | LAS VEGAS Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-magenta: #FF007F;
            --secondary-green: #006400;
            --admin-bg: #F8F9FB;
            --sidebar-dark: #121212;
            --card-white: #FFFFFF;
            --text-main: #1A1A1A;
            --text-muted: #666666;
            --border-pink: #FFD1E3;
            --shadow-sm: 0 2px 10px rgba(0,0,0,0.05);
            --transition: all 0.3s ease;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: 'Quicksand', sans-serif; background: var(--admin-bg); color: var(--text-main); overflow-x: hidden; }

        .admin-wrapper { display: flex; min-height: 100vh; }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 260px; background: var(--sidebar-dark); color: white;
            display: flex; flex-direction: column; position: fixed;
            height: 100vh; z-index: 1000; transition: var(--transition);
        }
        .sidebar-header { padding: 30px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .logo-text { font-family: 'DM Serif Display', serif; color: var(--primary-magenta); font-size: 22px; }
        .nav-list { flex: 1; overflow-y: auto; padding: 20px 0; }
        .nav-item { display: flex; align-items: center; padding: 12px 25px; color: rgba(255,255,255,0.6); text-decoration: none; font-size: 14px; font-weight: 600; transition: var(--transition); }
        .nav-item:hover, .nav-item.active { color: white; background: rgba(255, 0, 127, 0.1); border-left: 4px solid var(--primary-magenta); }

        /* --- MAIN CONTENT --- */
        .main-content { flex: 1; margin-left: 260px; padding: 30px; transition: var(--transition); width: calc(100% - 260px); }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .breadcrumb { font-size: 13px; color: var(--text-muted); font-weight: 600; }
        .breadcrumb a { color: var(--primary-magenta); text-decoration: none; }

        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .page-title { font-family: 'DM Serif Display', serif; font-size: 28px; margin: 0; }
        .page-sub { font-size: 13px; color: var(--text-muted); font-weight: 600; margin-top: 4px; }

        /* --- STATS ROW --- */
        .stats-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 25px; }
        @media (min-width: 768px) { .stats-row { grid-template-columns: repeat(4, 1fr); } }
        .stat-card { background: white; border: 1px solid var(--border-pink); border-radius: 16px; padding: 18px; box-shadow: var(--shadow-sm); }
        .stat-label { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; display: block; margin-bottom: 6px; }
        .stat-value { font-size: 22px; font-weight: 700; font-family: 'DM Serif Display', serif; color: var(--primary-magenta); }

        /* --- FILTER BAR --- */
        .filter-bar {
            background: white; border: 1px solid var(--border-pink); border-radius: 18px;
            padding: 16px 20px; margin-bottom: 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
        }
        .filter-bar input[type="text"], .filter-bar select {
            padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border-pink);
            font-family: 'Quicksand', sans-serif; font-size: 13px; font-weight: 600;
        }
        .filter-bar input[type="text"] { flex: 1; min-width: 200px; }

        /* --- TABLE --- */
        .card { background: white; border-radius: 20px; border: 1px solid var(--border-pink); padding: 25px; box-shadow: var(--shadow-sm); }
        .table-wrap { overflow-x: auto; }
        .admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .admin-table th { text-align: left; padding: 10px; border-bottom: 2px solid #f0f0f0; color: var(--text-muted); text-transform: uppercase; font-size: 11px; white-space: nowrap; }
        .admin-table td { padding: 12px 10px; border-bottom: 1px solid #f9f9f9; vertical-align: middle; }
        .admin-table tr:hover { background: #FFF9FB; cursor: pointer; }

        .u-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--primary-magenta); color: white; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; margin-right: 10px; vertical-align: middle; }
        .u-name-cell { display: flex; align-items: center; }
        .u-name { font-weight: 700; }
        .u-email { font-size: 11px; color: var(--text-muted); }

        .status-pill { padding: 5px 12px; border-radius: 50px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .status-ACTIVE { background: #F0FFF4; color: var(--secondary-green); }
        .status-SUSPENDED { background: #FFF0F0; color: #D00000; }

        .btn-action { background: var(--primary-magenta); color: white; border: none; padding: 8px 16px; border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-action.ghost { background: white; color: var(--primary-magenta); border: 1px solid var(--border-pink); }

        .pagination { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; font-size: 12px; font-weight: 700; color: var(--text-muted); }
        .pagination-btns { display: flex; gap: 8px; }
        .pagination button { background: white; border: 1px solid var(--border-pink); border-radius: 8px; padding: 6px 14px; font-weight: 700; cursor: pointer; }
        .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }

        .skeleton { height: 20px; background: #eee; border-radius: 5px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
        .empty-state { text-align: center; padding: 40px; color: #999; font-size: 13px; }

        .mobile-toggle { display: none; background: none; border: none; font-size: 24px; cursor: pointer; }
        @media (max-width: 1024px) {
            .sidebar { left: -260px; }
            .sidebar.active { left: 0; }
            .main-content { margin-left: 0; width: 100%; }
            .mobile-toggle { display: block; }
        }

        .toast {
            position: fixed; bottom: 20px; right: 20px; background: #121212; color: white;
            padding: 14px 20px; border-radius: 12px; font-size: 13px; font-weight: 700; z-index: 3000;
            opacity: 0; transform: translateY(10px); transition: var(--transition);
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { background: #D00000; }
    </style>
</head>
<body>

    <div class="admin-wrapper">
        <aside class="sidebar" id="adminSidebar">
            <div class="sidebar-header">
                <div class="logo-text">LAS VEGAS ADMIN</div>
            </div>
            <nav class="nav-list">
                <a href="index.html" class="nav-item">📊 Dashboard</a>
                <a href="users.html" class="nav-item active">👥 Users</a>
                <a href="plans.html" class="nav-item">📈 Plans</a>
                <a href="investments.html" class="nav-item">💰 Investments</a>
                <a href="earnings.html" class="nav-item">💸 Earnings</a>
                <a href="deposits.html" class="nav-item">📥 Deposits</a>
                <a href="withdrawals.html" class="nav-item">📤 Withdrawals</a>
                <a href="transactions.html" class="nav-item">📜 Transactions</a>
                <a href="#" id="logoutBtn" class="nav-item" style="margin-top: 20px; color: #ff4d4d;">🚪 Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <button class="mobile-toggle" id="menuBtn">☰</button>
                <div class="breadcrumb"><a href="index.html">Dashboard</a> / Users</div>
            </header>

            <div class="page-header">
                <div>
                    <h1 class="page-title">Users</h1>
                    <div class="page-sub" id="page-sub">Loading member list…</div>
                </div>
            </div>

            <div class="stats-row">
                <div class="stat-card"><span class="stat-label">Total Users</span><div class="stat-value" id="stat-total">--</div></div>
                <div class="stat-card"><span class="stat-label">Active</span><div class="stat-value" id="stat-active">--</div></div>
                <div class="stat-card"><span class="stat-label">Suspended</span><div class="stat-value" id="stat-suspended">--</div></div>
                <div class="stat-card"><span class="stat-label">New (7 days)</span><div class="stat-value" id="stat-new">--</div></div>
            </div>

            <div class="filter-bar">
                <input type="text" id="search-input" placeholder="Search by name, email, or referral code…">
                <select id="status-filter">
                    <option value="">All Statuses</option>
                    <option value="ACTIVE">Active</option>
                    <option value="SUSPENDED">Suspended</option>
                </select>
                <select id="sort-select">
                    <option value="created_at.desc">Newest First</option>
                    <option value="created_at.asc">Oldest First</option>
                    <option value="full_name.asc">Name A–Z</option>
                </select>
            </div>

            <div class="card">
                <div class="table-wrap">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Member</th>
                                <th>Status</th>
                                <th>Balance</th>
                                <th>Referral Code</th>
                                <th>Joined</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="users-list">
                            <tr><td colspan="6"><div class="skeleton"></div></td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination">
                    <span id="pagination-info">--</span>
                    <div class="pagination-btns">
                        <button id="btn-prev">← Prev</button>
                        <button id="btn-next">Next →</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const supabase = createClient(import.meta.env.VITE_SUPABASE_URL, import.meta.env.VITE_SUPABASE_ANON_KEY);

        const UsersApp = {
            page: 0,
            pageSize: 20,
            totalCount: 0,
            search: '',
            statusFilter: '',
            sort: 'created_at.desc',
            searchDebounce: null,

            async init() {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) return window.location.href = 'login.html';
                this.session = session;

                const { data: adminProfile } = await supabase.from('profiles').select('is_admin').eq('id', session.user.id).single();
                if (!adminProfile || !adminProfile.is_admin) return window.location.href = 'login.html';

                this.setupUI();
                await Promise.all([this.loadStats(), this.loadUsers()]);
            },

            setupUI() {
                document.getElementById('menuBtn').onclick = () => document.getElementById('adminSidebar').classList.toggle('active');
                document.getElementById('logoutBtn').onclick = () => supabase.auth.signOut().then(() => window.location.href = 'login.html');

                document.getElementById('search-input').oninput = (e) => {
                    clearTimeout(this.searchDebounce);
                    this.searchDebounce = setTimeout(() => {
                        this.search = e.target.value.trim();
                        this.page = 0;
                        this.loadUsers();
                    }, 350);
                };
                document.getElementById('status-filter').onchange = (e) => {
                    this.statusFilter = e.target.value;
                    this.page = 0;
                    this.loadUsers();
                };
                document.getElementById('sort-select').onchange = (e) => {
                    this.sort = e.target.value;
                    this.page = 0;
                    this.loadUsers();
                };
                document.getElementById('btn-prev').onclick = () => { if (this.page > 0) { this.page--; this.loadUsers(); } };
                document.getElementById('btn-next').onclick = () => {
                    if ((this.page + 1) * this.pageSize < this.totalCount) { this.page++; this.loadUsers(); }
                };
            },

            async loadStats() {
                const [{ count: total }, { count: active }, { count: suspended }, { count: newCount }] = await Promise.all([
                    supabase.from('profiles').select('*', { count: 'exact', head: true }),
                    supabase.from('profiles').select('*', { count: 'exact', head: true }).eq('status', 'ACTIVE'),
                    supabase.from('profiles').select('*', { count: 'exact', head: true }).eq('status', 'SUSPENDED'),
                    supabase.from('profiles').select('*', { count: 'exact', head: true })
                        .gte('created_at', new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString())
                ]);
                document.getElementById('stat-total').innerText = total ?? 0;
                document.getElementById('stat-active').innerText = active ?? 0;
                document.getElementById('stat-suspended').innerText = suspended ?? 0;
                document.getElementById('stat-new').innerText = newCount ?? 0;
            },

            async loadUsers() {
                const list = document.getElementById('users-list');
                list.innerHTML = '<tr><td colspan="6"><div class="skeleton"></div></td></tr>';

                let query = supabase.from('profiles').select('id, full_name, email, status, referral_code, created_at, wallets(balance)', { count: 'exact' });

                if (this.search) {
                    query = query.or(`full_name.ilike.%${this.search}%,email.ilike.%${this.search}%,referral_code.ilike.%${this.search}%`);
                }
                if (this.statusFilter) {
                    query = query.eq('status', this.statusFilter);
                }
                const [sortCol, sortDir] = this.sort.split('.');
                query = query.order(sortCol, { ascending: sortDir === 'asc' });

                const from = this.page * this.pageSize;
                const to = from + this.pageSize - 1;
                query = query.range(from, to);

                const { data, count, error } = await query;
                if (error) {
                    list.innerHTML = `<tr><td colspan="6" class="empty-state">Failed to load users: ${error.message}</td></tr>`;
                    return;
                }

                this.totalCount = count || 0;
                document.getElementById('page-sub').innerText = `${this.totalCount} member${this.totalCount === 1 ? '' : 's'} found`;

                if (!data || data.length === 0) {
                    list.innerHTML = '<tr><td colspan="6" class="empty-state">No users match your filters.</td></tr>';
                } else {
                    list.innerHTML = data.map(u => {
                        const balance = u.wallets?.[0]?.balance ?? u.wallets?.balance ?? 0;
                        const initial = (u.full_name || '?').charAt(0).toUpperCase();
                        const status = u.status || 'ACTIVE';
                        return `
                        <tr data-id="${u.id}">
                            <td>
                                <div class="u-name-cell">
                                    <span class="u-avatar">${initial}</span>
                                    <div>
                                        <div class="u-name">${u.full_name || '—'}</div>
                                        <div class="u-email">${u.email || ''}</div>
                                    </div>
                                </div>
                            </td>
                            <td><span class="status-pill status-${status}">${status}</span></td>
                            <td>${this.formatCurrency(balance)}</td>
                            <td style="font-family:monospace;">${u.referral_code || '—'}</td>
                            <td>${u.created_at ? new Date(u.created_at).toLocaleDateString() : '—'}</td>
                            <td><a class="btn-action ghost" href="review-member.html?id=${u.id}">View →</a></td>
                        </tr>`;
                    }).join('');

                    list.querySelectorAll('tr[data-id]').forEach(row => {
                        row.addEventListener('click', (e) => {
                            if (e.target.closest('a')) return; // let the link handle its own click
                            window.location.href = `review-member.html?id=${row.dataset.id}`;
                        });
                    });
                }

                const start = this.totalCount === 0 ? 0 : from + 1;
                const end = Math.min(to + 1, this.totalCount);
                document.getElementById('pagination-info').innerText = `Showing ${start}–${end} of ${this.totalCount}`;
                document.getElementById('btn-prev').disabled = this.page === 0;
                document.getElementById('btn-next').disabled = to + 1 >= this.totalCount;
            },

            showToast(message, isError = false) {
                const t = document.getElementById('toast');
                t.innerText = message;
                t.className = `toast show ${isError ? 'error' : ''}`;
                setTimeout(() => t.classList.remove('show'), 3000);
            },

            formatCurrency(val) {
                return new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN' }).format(val || 0);
            }
        };

        window.UsersApp = UsersApp;
        document.addEventListener('DOMContentLoaded', () => UsersApp.init());
    </script>
</body>
</html>
