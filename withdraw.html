<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw | LAS VEGAS</title>
    <style>
        :root { --pink: #FF007F; --green: #006400; --bg: #FFF5F7; }
        body { font-family: 'Quicksand', sans-serif; background: var(--bg); margin: 0; padding: 20px; padding-bottom: 100px; }
        .card { background: white; border-radius: 25px; border: 1px solid #FFD1E3; padding: 25px; box-shadow: 0 10px 30px rgba(255,0,127,0.05); margin-bottom: 20px; }
        .bal-display { background: var(--pink); color: white; padding: 20px; border-radius: 20px; text-align: center; margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #FFD1E3; font-size: 18px; font-weight: 700; box-sizing: border-box; }
        .fee-panel { background: #F8F9FB; border-radius: 15px; padding: 15px; font-size: 13px; line-height: 1.8; }
        .btn-withdraw { background: var(--pink); color: white; border: none; padding: 18px; border-radius: 50px; width: 100%; font-weight: 800; cursor: pointer; margin-top: 20px; }
        .status-badge { padding: 4px 10px; border-radius: 50px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .pending { background: #FFF9E6; color: #D4A017; }
    </style>
</head>
<body>
    <div class="bal-display">
        <span style="font-size: 12px; opacity: 0.8; text-transform: uppercase;">Available Balance</span>
        <h1 id="user-balance" style="margin: 5px 0 0 0;">₦0.00</h1>
    </div>

    <div class="card">
        <h3 style="color: var(--pink); margin-top: 0;">Withdraw Funds</h3>
        <div class="input-group">
            <label style="font-weight: 700; color: var(--pink); font-size: 12px;">Amount to Receive (₦)</label>
            <input type="number" id="withdraw-amount" placeholder="Min. 600">
        </div>

        <div class="fee-panel">
            <div style="display: flex; justify-content: space-between;"><span>Processing Fee (15%):</span> <span id="fee-amount">₦0.00</span></div>
            <div style="display: flex; justify-content: space-between; font-weight: 800; border-top: 1px solid #ddd; margin-top: 5px; padding-top: 5px;">
                <span>Total Deductible:</span> <span id="total-required">₦0.00</span>
            </div>
        </div>

        <button class="btn-withdraw" id="submit-btn">WITHDRAW</button>
    </div>

    <div class="card">
        <h3 style="font-size: 16px;">Recent Withdrawals</h3>
        <div id="history-list"></div>
    </div>

    <script type="module">
        const amtInput = document.getElementById('withdraw-amount');
        amtInput.oninput = () => {
            const val = parseFloat(amtInput.value) || 0;
            const fee = val * 0.15;
            document.getElementById('fee-amount').innerText = `₦${fee.toLocaleString()}`;
            document.getElementById('total-required').innerText = `₦${(val + fee).toLocaleString()}`;
        };
        // submit-btn fetch call to /api/payments?action=withdraw ...
    </script>
</body>
</html>
